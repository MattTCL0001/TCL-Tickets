<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Gestion TCL</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
@font-face {
    font-family: "Google Sans Flex";
    src: url("./fonts/Google Sans Flex.ttf") format("truetype");
    font-weight: 100 1000;
    font-stretch: 25% 151%;
    font-style: normal;
    font-display: swap;
}

:root {
    --red: #E2001A;
    --red-dark: rgba(226,0,26,0.25);
    --bg-dark: #1a1a2e;
    --bg-card: #252542;
    --bg-header: #1e1e3f;
    --border: rgba(255,255,255,0.1);
    --text: #fff;
    --text-muted: rgba(255,255,255,0.6);
    --radius: 8px;
    --gsf: "Google Sans Flex", sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%;margin:0;padding:0}

body {
    background: var(--bg-dark) url('./bg.png') center/cover no-repeat fixed;
    color: var(--text);
    font-family: var(--gsf);
}

body::before {
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    z-index:0;
    pointer-events:none;
}

.page-header {
    position:sticky;
    top:0;
    z-index:100;
    height:68px;
    display:flex;
    align-items:center;
    gap:1rem;
    padding:0 1.5rem 0 0;
    background:var(--bg-header);
    border-bottom:1px solid var(--border);
}

.header-svg-wrap{height:100%;flex-shrink:0;display:flex;align-items:stretch}
.header-svg-wrap svg{height:100%;width:auto;display:block}
.page-header h1{font-size:1.05rem;font-weight:380;margin:0;letter-spacing:.01em}

.sync-status{
    font-size:11px;
    font-weight:600;
    padding:4px 10px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
}
.sync-status.idle{background:rgba(255,255,255,0.1);color:var(--text-muted)}
.sync-status.saving{background:rgba(255,255,255,0.2);color:var(--text)}
.sync-status.ok{background:rgba(46,125,50,0.3);color:#a5d6a7}
.sync-status.error{background:rgba(181,0,21,0.3);color:#ef9a9a}

.toolbar-btn, .btn-add {
    background:rgba(255,255,255,0.1);
    color:#fff;
    border:1px solid rgba(255,255,255,0.2);
    font-weight:600;
    padding:.45rem 1rem;
    border-radius:var(--radius);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:.85rem;
    transition:all .15s;
}

.toolbar-btn i, .btn-add i {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    vertical-align:middle;
}

.toolbar-btn:hover{background:rgba(255,255,255,0.2)}

.btn-add{
    margin-left:auto;
    background:var(--red);
    border-color:rgba(255,255,255,0.3);
    font-weight:700;
}
.btn-add:hover{background:#c40015}

.content-area{
    position:relative;
    z-index:1;
    padding:1.5rem;
}

.stats-bar{
    display:flex;
    gap:.85rem;
    margin-bottom:1.25rem;
    flex-wrap:wrap;
}

.stat-card{
    background:var(--bg-card);
    padding:.85rem 1.25rem;
    min-width:130px;
    border-radius:var(--radius);
    border:1px solid var(--border);
}

.stat-card .label{
    font-size:11px;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:4px;
    font-variation-settings:"wght" 400,"wdth" 87.5,"GRAD" 100,"ROND" 66,"slnt" 0;
}

.stat-card .value{
    font-size:1.5rem;
    color:#fff;
    font-variation-settings:"wght" 692,"wdth" 125,"GRAD" 0,"ROND" 0,"slnt" -8;
}

.table-card{
    background:var(--bg-card);
    border-radius:var(--radius);
    border:1px solid var(--border);
    overflow:hidden;
}

.table-card table{margin:0;font-size:.875rem;width:100%}
.table-card thead th{
    background:var(--bg-header);
    color:var(--text-muted);
    font-weight:600;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    padding:.85rem 1rem;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
    text-align:left;
}

.table-card thead th:hover{color:#fff}
.table-card thead th.no-sort{cursor:default}
.table-card thead th.sorted-col{color:#ff6b7a}

.sort-icon{margin-left:4px;font-size:13px;opacity:.35;vertical-align:middle}
.sort-icon.active{opacity:1}

.table-card tbody td{
    padding:.75rem 1rem;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
    color:#fff;
}

.table-card tbody tr:hover td{background:rgba(255,255,255,0.05)}
.table-card tbody tr.selected td{background:rgba(226,0,26,0.15)}
.table-card tbody tr:last-child td{border-bottom:none}

.badge-format{
    display:inline-flex;
    align-items:center;
    padding:3px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:600;
    background:rgba(226,0,26,0.2);
    color:#ff8a8a;
    vertical-align:middle;
}

.badge-etat{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:4px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:600;
    vertical-align:middle;
}
.badge-etat i {
    display:inline-flex;
    align-items:center;
    justify-content:center;
}
.badge-etat.ok{background:rgba(46,125,50,0.2);color:#a5d6a7}
.badge-etat.ko{background:rgba(181,0,21,0.2);color:#ef9a9a}

.zones-cell, .emprunteur-cell{
    display:flex;
    align-items:center;
    gap:6px;
}

.zone-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    display:inline-block;
    vertical-align:middle;
}

.emp-avatar{
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--red-dark);
    color:#ff8a8a;
    font-size:11px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.btn-edit{
    background:rgba(255,255,255,0.1);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:6px;
    padding:4px 10px;
    font-size:12px;
    cursor:pointer;
    transition:all .15s;
    display:inline-flex;
    align-items:center;
    gap:5px;
    vertical-align:middle;
}
.btn-edit i {
    display:inline-flex;
    align-items:center;
    justify-content:center;
}
.btn-edit:hover{background:var(--red-dark);border-color:var(--red);color:#ff8a8a}

.empty-state{
    text-align:center;
    padding:3rem 1rem;
    color:var(--text-muted);
}
.empty-state i{font-size:3rem;display:block;margin-bottom:1rem}

.search-wrap{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,0.1);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    width:220px;
}

.search-icon-btn{
    background:none;
    border:none;
    color:#fff;
    padding:0 10px;
    cursor:pointer;
    font-size:1rem;
    display:flex;
    align-items:center;
    justify-content:center;
}

.search-input{
    background:none;
    border:none;
    outline:none;
    color:#fff;
    font-size:.85rem;
    width:100%;
    padding:6px 8px;
}
.search-input::placeholder{color:var(--text-muted)}

#myModal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    z-index:1050;
    align-items:center;
    justify-content:center;
}
#myModal.open{display:flex}

.modal-box{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:1.75rem;
    width:100%;
    max-width:520px;
    max-height:92vh;
    overflow-y:auto;
}

.modal-header-custom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:1.5rem;
}

.modal-header-custom h5{
    font-size:1.05rem;
    font-weight:600;
    margin:0;
    color:#ff8a8a;
    display:flex;
    align-items:center;
    gap:7px;
}

.modal-header-custom h5 i {
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.modal-close{
    background:rgba(255,255,255,0.1);
    border:1px solid var(--border);
    color:var(--text);
    cursor:pointer;
    border-radius:6px;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
}
.modal-close:hover{background:rgba(255,255,255,0.2)}

.form-label-sm{
    font-size:11px;
    font-weight:600;
    color:var(--text-muted);
    text-transform:uppercase;
    margin-bottom:6px;
    display:block;
}

.form-group{margin-bottom:1rem}

.modal-actions{
    display:flex;
    gap:.75rem;
    margin-top:1.5rem;
    padding-top:1rem;
    border-top:1px solid var(--border);
}

input.form-control, .custom-select-btn{
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    border-radius:var(--radius);
    font-size:.875rem;
    color:#fff;
    padding:.55rem .85rem;
    width:100%;
    font-family: var(--gsf);
    transition: border-color .15s, background .15s;
}

input.form-control:focus, .custom-select-btn:focus{
    outline:none;
    border-color:var(--red);
    background:rgba(255,255,255,0.08);
}

input.form-control:disabled, .custom-select-btn.disabled-field{
    opacity:0.5;
    cursor:not-allowed;
}

input.form-control.field-error, .custom-select-btn.field-error{
    border-color: var(--red);
    background: rgba(226,0,26,0.1);
}

#idWrapper{
    display:flex;
    align-items:center;
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    background:rgba(255,255,255,0.05);
    transition: border-color .15s;
}

#idPrefixSpan{
    padding:.55rem .7rem;
    color:var(--text-muted);
    background:rgba(255,255,255,0.05);
    border-right:1px solid var(--border);
    white-space:nowrap;
    font-family: var(--gsf);
    font-variation-settings: 'slnt' 0,'wdth' 75,'GRAD' 0,'ROND' 100;
}

#mIdSuffix{
    border:none;
    outline:none;
    flex:1;
    padding:.55rem .85rem;
    color:#fff;
    background:transparent;
    font-family: var(--gsf);
    font-variation-settings: 'slnt' 0,'wdth' 75,'GRAD' 0,'ROND' 100;
}

.btn-save, .btn-delete, .btn-cancel {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
}

.btn-save i, .btn-delete i, .btn-cancel i {
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.btn-save{
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:var(--radius);
    padding:.6rem 1.25rem;
    font-weight:700;
    flex:1;
    cursor:pointer;
}
.btn-save:hover{background:#c40015}

.btn-delete{
    background:rgba(181,0,21,0.2);
    color:#ef9a9a;
    border:1px solid rgba(239,154,154,0.3);
    border-radius:var(--radius);
    padding:.6rem 1.25rem;
    cursor:pointer;
}
.btn-delete:hover{background:rgba(181,0,21,0.3)}

.btn-cancel{
    background:rgba(255,255,255,0.1);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:.6rem 1rem;
    cursor:pointer;
}
.btn-cancel:hover{background:rgba(255,255,255,0.2)}

.custom-select-wrap{position:relative}

.custom-select-btn{
    cursor:pointer;
    text-align:left;
    display:flex;
    align-items:center;
    justify-content:space-between;
    user-select:none;
}

.custom-select-btn.placeholder{color:var(--text-muted)}
.custom-select-btn .chevron{font-size:14px;opacity:.5;display:inline-flex;align-items:center;justify-content:center}

.custom-dropdown{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    right:0;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:8px;
    z-index:2000;
    max-height:220px;
    overflow-y:auto;
    display:none;
    padding:4px;
}
.custom-dropdown.open{display:block}

.custom-dropdown-item{
    padding:.5rem .85rem;
    font-size:.875rem;
    border-radius:6px;
    cursor:pointer;
    color:var(--text);
    display:flex;
    align-items:center;
    gap:7px;
}
.custom-dropdown-item:hover{background:rgba(255,255,255,0.1)}
.custom-dropdown-item.selected{background:rgba(226,0,26,0.2);color:#ff8a8a}

.suffix-display{
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    border-radius:6px;
    padding:.55rem .85rem;
    font-family:monospace;
    font-size:.95rem;
    color:#ff8a8a;
    font-weight:700;
}

.toggle-group{
    display:flex;
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
}

.toggle-group input[type=radio]{display:none}

.toggle-group label{
    flex:1;
    text-align:center;
    padding:.5rem;
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
    color:var(--text-muted);
    transition: all .15s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
}

.toggle-group label i {
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

#fOui:checked + label{background:rgba(46,125,50,0.3);color:#a5d6a7}
#fNon:checked + label{background:rgba(181,0,21,0.3);color:#ef9a9a}

.toggle-group.field-error{
    border-color: var(--red);
}

.row-2col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:.75rem;
}

.id-style{
    color:#ff8a8a;
    font-variation-settings:"wght" 72,"wdth" 50,"GRAD" 0,"ROND" 0,"slnt" 0;
}
.suffixe-style{
    color:var(--text-muted);
    font-variation-settings:"wght" 230,"wdth" 76,"GRAD" 0,"ROND" 75,"slnt" -5;
}
.contenu-style{
    font-weight:139;
    font-variation-settings:"slnt" 0,"wdth" 70,"GRAD" 0,"ROND" 0;
}

@media(max-width:860px){
    .search-wrap{width:36px}
    .search-wrap:focus-within{width:180px}
    .search-input{width:0;padding:0}
    .search-wrap:focus-within .search-input{width:140px;padding:6px 8px}
}

@media(max-width:1100px){
    .badge-etat .text-collapse, .btn-edit .text-collapse{display:none}
}
</style>
</head>
<body>

<div class="page-header">
    <div class="header-svg-wrap">
        <svg viewBox="0 0 804 398" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2">
            <g transform="matrix(1,0,0,1,-1185.232032,-1281.990164)">
                <g transform="matrix(0,1,-2.243502,0,3848.40344,315.149584)">
                    <path d="M1363.977,918.157L1363.977,1098.552C1363.977,1122.026 1343.056,1144.538 1305.817,1161.137C1268.579,1177.735 1218.072,1187.06 1165.409,1187.06C1055.743,1187.06 966.841,1147.434 966.841,1098.552L966.841,918.157L1165.409,828.781L1363.977,918.157Z" style="fill:rgba(255,255,255,0.15)"/>
                </g>
                <g transform="matrix(0.173485,0,0,0.173433,712.57317,1394.882698)">
                    <path d="M5373,234L5384,390L4904,391C4847,391 4801,436 4801,493C4802,552 4848,598 4905,598L5385,597L5374,754C5287,895 5132,988 4953,988C4682,988 4460,767 4460,493C4460,444 4468,395 4482,350L4327,350L4328,954L3936,954L3935,350L3698,350L3698,35L4564,35L4564,190C4654,74 4795,0 4953,0C5132,0 5287,93 5373,234ZM5374,754L5615,494L5373,234L5373,35L5782,35L5783,623L6137,623L6138,953L5374,954L5374,754Z" style="fill:white"/>
                </g>
            </g>
        </svg>
    </div>
    <h1><i class="ti ti-ticket" style="vertical-align:middle;margin-right:8px"></i>Gestion des tickets</h1>
    <div id="syncStatus" class="sync-status idle"><i class="ti ti-cloud"></i> <span>Synchronisé</span></div>
    <div class="search-wrap">
        <button class="search-icon-btn" onclick="document.getElementById('searchInput').focus()" tabindex="-1">
            <i class="ti ti-search"></i>
        </button>
        <input type="search" id="searchInput" class="search-input" placeholder="Suffixe, contenu…" oninput="render()">
    </div>
    <button class="toolbar-btn" onclick="exporterJSON()"><i class="ti ti-download"></i> Exporter</button>
    <button class="toolbar-btn" onclick="document.getElementById('importFile').click()"><i class="ti ti-upload"></i> Importer</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importerJSON(this.files[0])">
    <button class="btn-add" onclick="ouvrirModal()"><i class="ti ti-plus"></i> Ajouter un ticket</button>
</div>

<div class="content-area">
    <div class="stats-bar" id="statsBar"></div>
    <div class="table-card">
        <table class="table-borderless mb-0">
            <thead><tr>
                <th onclick="sortBy('id')">ID complet <i class="ti ti-arrows-sort sort-icon" data-col="id"></i></th>
                <th onclick="sortBy('suffixe')">Suffixe <i class="ti ti-arrows-sort sort-icon" data-col="suffixe"></i></th>
                <th onclick="sortBy('format')">Format <i class="ti ti-arrows-sort sort-icon" data-col="format"></i></th>
                <th onclick="sortBy('contenu')">Contenu <i class="ti ti-arrows-sort sort-icon" data-col="contenu"></i></th>
                <th onclick="sortBy('zones')">Zones <i class="ti ti-arrows-sort sort-icon" data-col="zones"></i></th>
                <th onclick="sortBy('quantite')">Qté <i class="ti ti-arrows-sort sort-icon" data-col="quantite"></i></th>
                <th onclick="sortBy('emprunteur')">Emprunteur <i class="ti ti-arrows-sort sort-icon" data-col="emprunteur"></i></th>
                <th onclick="sortBy('fonctionnel')">Fonctionnel <i class="ti ti-arrows-sort sort-icon" data-col="fonctionnel"></i></th>
                <th class="no-sort"></th>
            </tr></thead>
            <tbody id="ticketBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display:none">
            <i class="ti ti-ticket-off"></i>
            Aucun ticket enregistré.
        </div>
    </div>
</div>

<div id="myModal">
    <div class="modal-box">
        <div class="modal-header-custom">
            <h5 id="modalTitle"><i class="ti ti-ticket"></i> Nouveau ticket</h5>
            <button class="modal-close" onclick="fermerModal()"><i class="ti ti-x"></i></button>
        </div>
        <input type="hidden" id="editIndex">

        <div class="form-group">
            <label class="form-label-sm">Numéro de ticket <span id="idCounter" style="font-weight:400;color:var(--text-muted);letter-spacing:0;text-transform:none">(0/12 chiffres)</span></label>
            <div id="idWrapper">
                <span id="idPrefixSpan">06-14988599</span>
                <input type="text" id="mIdSuffix" placeholder="000000000000" maxlength="12" oninput="onIdInput(this)">
            </div>
            <input type="hidden" id="mId">
            <div id="idError" style="font-size:11px;color:#ff8a8a;margin-top:6px;display:none"></div>
        </div>

        <div class="form-group">
            <label class="form-label-sm">Suffixe (caractères 18–23)</label>
            <div class="suffix-display" id="mSuffixeDisplay">—</div>
            <input type="hidden" id="mSuffixe">
        </div>

        <div class="row-2col">
            <div class="form-group">
                <label class="form-label-sm">Contenu</label>
                <div class="custom-select-wrap" id="wrapContenu">
                    <button type="button" class="custom-select-btn placeholder" id="btnContenu" onclick="toggleDropdown('Contenu')">
                        <span id="lblContenu">Sélectionner…</span><i class="ti ti-chevron-down chevron"></i>
                    </button>
                    <div class="custom-dropdown" id="dropContenu"></div>
                    <input type="hidden" id="mContenu">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label-sm">Format</label>
                <div class="custom-select-wrap" id="wrapFormat">
                    <button type="button" class="custom-select-btn placeholder" id="btnFormat" onclick="toggleDropdown('Format')">
                        <span id="lblFormat">Sélectionner…</span><i class="ti ti-chevron-down chevron"></i>
                    </button>
                    <div class="custom-dropdown" id="dropFormat"></div>
                    <input type="hidden" id="mFormat">
                </div>
            </div>
        </div>

        <div class="row-2col">
            <div class="form-group">
                <label class="form-label-sm">Zones</label>
                <div class="custom-select-wrap" id="wrapZones">
                    <button type="button" class="custom-select-btn placeholder" id="btnZones" onclick="toggleDropdown('Zones')">
                        <span id="lblZones">Sélectionner…</span><i class="ti ti-chevron-down chevron"></i>
                    </button>
                    <div class="custom-dropdown" id="dropZones"></div>
                    <input type="hidden" id="mZones">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label-sm">Quantité</label>
                <input type="number" id="mQte" placeholder="ex. 10" class="form-control" min="1">
                <div id="qteError" style="font-size:11px;color:#ff8a8a;margin-top:6px;display:none">Quantité requise</div>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label-sm">Emprunteur</label>
            <input type="text" id="mEmp" placeholder="— si non emprunté" class="form-control">
        </div>

        <div class="form-group">
            <label class="form-label-sm">Fonctionnel</label>
            <div class="toggle-group" id="toggleGroup">
                <input type="radio" name="mFonctionnel" id="fOui" value="oui">
                <label for="fOui"><i class="ti ti-check"></i> Fonctionnel</label>
                <input type="radio" name="mFonctionnel" id="fNon" value="non">
                <label for="fNon"><i class="ti ti-x"></i> Non fonctionnel</label>
            </div>
            <div id="foncError" style="font-size:11px;color:#ff8a8a;margin-top:6px;display:none">Veuillez sélectionner une option</div>
        </div>

        <div class="modal-actions">
            <button class="btn-save" onclick="sauvegarder()"><i class="ti ti-device-floppy"></i> Enregistrer</button>
            <button id="btnSupp" class="btn-delete" onclick="confirmerSuppression(event)" style="display:none"><i class="ti ti-trash"></i> Supprimer</button>
            <button class="btn-cancel" onclick="fermerModal()">Annuler</button>
        </div>
    </div>
</div>

<script>
const API_URL = 'https://api.npoint.io/31ba31f685940c724c54';
const PREFIX  = '06-14988599';
const VAR_LEN = 12;

let tickets = [];
let sortColumn    = 'id';
let sortDirection = 'asc';

const $ = id => document.getElementById(id);

const DROPDOWN_DATA = {
    Contenu: [
        'Vide','Inconnu','1 voyage','1 voyage à bord','10 voyages',
        '10 voyages (-26 ans/étudiants)','10 voyages famille nombreuse',
        'Pass 24h','Pass 48h','Pass 72h','Pass 7 jours','Pass tribu',
        'Groupe 10 personnes','Aller simple Navigône','Aller-retour Navigône',
        'Aller-retour Funiculaire','Pass TCL en fête','Pass Pic Pollution'
    ],
    Format: [
        {v:'DAB',c:'#E2001A'},{v:'Rose Bus',c:'#e91e8c'},{v:'Bleu Bus',c:'#1a56c4'},
        {v:'Orange Bus',c:'#e07b00'},{v:'Vert Bus',c:'#2e7d32'},{v:'Agence',c:'#E2001A'},
        {v:'Paris 2024',c:'#1a56c4'},{v:'Rectangle',c:'#E2001A'}
    ],
    Zones: [
        {v:'Z1 & 2',  dots:['#E2001A','#e07b00']},
        {v:'Z2 & 3',  dots:['#e07b00','#2e7d32']},
        {v:'Z3 & 4',  dots:['#2e7d32','#1a56c4']},
        {v:'Z4 & 5',  dots:['#1a56c4','#e91e8c']},
        {v:'Z2 & EXT',dots:['#e07b00','#f5c518']},
        {v:'Z3 & EXT',dots:['#2e7d32','#f5c518']},
        {v:'Z4 & EXT',dots:['#1a56c4','#f5c518']},
        {v:'Z5 & EXT',dots:['#e91e8c','#f5c518']},
        {v:'Toutes zones sauf Z1',dots:['#7c3aed','#E2001A']},
        {v:'Toutes zones',dots:['#7c3aed']}
    ]
};

const ZONE_MAP = Object.fromEntries(DROPDOWN_DATA.Zones.map(z => [z.v, z.dots]));

function buildDropdowns() {
    const build = (name, items) => {
        const drop = $('drop' + name);
        const frag = document.createDocumentFragment();
        const placeholder = document.createElement('div');
        placeholder.className = 'custom-dropdown-item placeholder-item';
        placeholder.textContent = 'Sélectionner…';
        placeholder.style.opacity = '0.5';
        placeholder.style.pointerEvents = 'none';
        frag.appendChild(placeholder);
        items.forEach(item => {
            const el = document.createElement('div');
            el.className = 'custom-dropdown-item';
            el.onclick = () => selectOption(name, typeof item === 'string' ? item : item.v);
            if (typeof item === 'string') {
                el.textContent = item;
            } else if (name === 'Format') {
                el.innerHTML = `<span class="zone-dot" style="background:${item.c}"></span>${item.v}`;
            } else {
                el.innerHTML = item.dots.map(c => `<span class="zone-dot" style="background:${c}"></span>`).join('') + item.v;
            }
            frag.appendChild(el);
        });
        drop.appendChild(frag);
    };
    build('Contenu', DROPDOWN_DATA.Contenu);
    build('Format',  DROPDOWN_DATA.Format);
    build('Zones',   DROPDOWN_DATA.Zones);
}

function zonesDots(val) {
    if (!val || val === '—') return '';
    const dots = ZONE_MAP[val];
    return dots ? dots.map(c => `<span class="zone-dot" style="background:${c}"></span>`).join('') : '';
}

const FORMAT_CLASS = {
    DAB:'rouge','Vert Bus':'rouge',Agence:'rouge',Rectangle:'rouge',
    'Bleu Bus':'bleu','Paris 2024':'bleu','Rose Bus':'rose','Orange Bus':'orange'
};
const formatClass = f => FORMAT_CLASS[f] || '';

const SYNC_ICONS = {idle:'ti-cloud',saving:'ti-cloud-upload',ok:'ti-cloud-check',error:'ti-cloud-x'};
function setSync(state, msg) {
    const el = $('syncStatus');
    el.className = `sync-status ${state}`;
    el.innerHTML = `<i class="ti ${SYNC_ICONS[state]}"></i> <span>${msg}</span>`;
}

async function charger() {
    setSync('saving', 'Chargement…');
    try {
        const r = await fetch(API_URL);
        if (!r.ok) throw new Error(r.status);
        const json = await r.json();
        tickets = Array.isArray(json) ? json : (json.data || []);
        localStorage.setItem('mesTickets', JSON.stringify(tickets));
        setSync('ok', 'Synchronisé');
    } catch {
        tickets = JSON.parse(localStorage.getItem('mesTickets')) || [];
        setSync('error', 'Hors ligne');
    }
    render();
}

async function sauvegarderAPI() {
    setSync('saving', 'Sauvegarde…');
    localStorage.setItem('mesTickets', JSON.stringify(tickets));
    try {
        const r = await fetch(API_URL, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify(tickets)
        });
        if (!r.ok) throw new Error(r.status);
        setSync('ok', 'Synchronisé');
    } catch {
        setSync('error', 'Erreur sync');
    }
}

function exporterJSON() {
    const blob = new Blob([JSON.stringify(tickets, null, 2)], {type: 'application/json'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const horodatage = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = url;
    a.download = `tickets-tcl-${horodatage}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
}

function importerJSON(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
        let data;
        try {
            data = JSON.parse(e.target.result);
        } catch {
            alert("Fichier JSON invalide.");
            return;
        }
        const liste = Array.isArray(data) ? data : (data.data || null);
        if (!Array.isArray(liste)) {
            alert("Format invalide.");
            return;
        }
        if (!confirm(`Écraser les ${tickets.length} ticket(s) par les ${liste.length} ticket(s) ?`)) return;
        tickets = liste;
        await sauvegarderAPI();
        render();
    };
    reader.readAsText(file);
}

function closeAllDropdowns(except) {
    ['Format','Zones','Contenu'].forEach(name => {
        if (name === except) return;
        $('drop'+name).classList.remove('open');
        $('btn'+name).classList.remove('open');
    });
}

function toggleDropdown(name) {
    const btn  = $('btn'+name);
    const drop = $('drop'+name);
    if (btn.classList.contains('disabled-field')) return;
    const isOpen = drop.classList.contains('open');
    closeAllDropdowns(null);
    if (!isOpen) { drop.classList.add('open'); btn.classList.add('open'); }
}

function selectOption(name, value) {
    const lbl  = $('lbl'+name);
    const btn  = $('btn'+name);
    const inp  = $('m'+name);
    const drop = $('drop'+name);
    inp.value  = value;
    if (name === 'Zones' && value) {
        lbl.innerHTML = zonesDots(value) + `<span style="margin-left:4px">${value}</span>`;
    } else {
        lbl.textContent = value || 'Sélectionner…';
    }
    btn.classList.toggle('placeholder', !value);
    btn.classList.remove('field-error');
    drop.querySelectorAll('.custom-dropdown-item').forEach((el, idx) => {
        if (idx === 0) return;
        el.classList.toggle('selected', el.textContent.trim() === value && !!value);
    });
    drop.classList.remove('open');
    btn.classList.remove('open');
    if (name === 'Contenu') onContenuChange(value);
}

const setDropdownValue    = selectOption;
const setDropdownDisabled = (name, disabled, displayValue) => {
    const btn = $('btn'+name);
    const inp = $('m'+name);
    const lbl = $('lbl'+name);
    if (disabled) {
        btn.classList.add('disabled-field');
        inp.value = displayValue ?? '—';
        lbl.textContent = displayValue ?? '—';
        btn.classList.remove('placeholder', 'field-error');
        $('drop'+name).classList.remove('open');
    } else {
        btn.classList.remove('disabled-field');
    }
};

document.addEventListener('click', e => {
    if (!e.target.closest('.custom-select-wrap')) closeAllDropdowns(null);
});

function onContenuChange(value) {
    const isVide    = value === 'Vide';
    const isInconnu = value === 'Inconnu';
    const isNon     = document.querySelector('input[name="mFonctionnel"]:checked')?.value === 'non';
    if (isNon) return;
    setDropdownDisabled('Zones', isVide || isInconnu, '—');
    const qteInp = $('mQte');
    if (isVide) {
        qteInp.value = '0'; qteInp.disabled = true;
        qteInp.classList.remove('field-error');
    } else if (isInconnu) {
        qteInp.value = '—'; qteInp.disabled = true;
        qteInp.classList.remove('field-error');
    } else {
        qteInp.disabled = false;
        if (qteInp.value === '0' || qteInp.value === '—') qteInp.value = '';
    }
}

function setNonFoncMode(isNon) {
    const qteInp = $('mQte');
    const mContenu = $('mContenu');
    const mZones = $('mZones');
    $('toggleGroup').classList.remove('field-error');
    $('foncError').style.display = 'none';
    if (isNon) {
        mContenu.dataset.prev = mContenu.value;
        mZones.dataset.prev = mZones.value;
        qteInp.dataset.prev = qteInp.value;
        setDropdownDisabled('Contenu', true, '—');
        setDropdownDisabled('Zones', true, '—');
        qteInp.value = '—'; qteInp.disabled = true;
        qteInp.classList.remove('field-error');
    } else {
        setDropdownDisabled('Contenu', false);
        setDropdownDisabled('Zones', false);
        qteInp.disabled = false;
        if (mContenu.value === '—') setDropdownValue('Contenu', mContenu.dataset.prev || '');
        if (mZones.value === '—') setDropdownValue('Zones', mZones.dataset.prev || '');
        if (qteInp.value === '—') qteInp.value = qteInp.dataset.prev || '';
        onContenuChange(mContenu.value);
    }
}

document.querySelectorAll('input[name="mFonctionnel"]').forEach(r =>
    r.addEventListener('change', function() { setNonFoncMode(this.value === 'non'); })
);

function onIdInput(el) {
    el.value = el.value.replace(/\D/g, '').slice(0, VAR_LEN);
    const n = el.value.length;
    $('idCounter').textContent = `(${n}/${VAR_LEN} chiffres)`;
    const err = n > 0 && n < VAR_LEN;
    const errEl = $('idError');
    errEl.style.display = err ? 'block' : 'none';
    errEl.textContent = err ? '12 chiffres requis' : '';
    $('idWrapper').style.borderColor = err ? 'var(--red)' : 'var(--border)';
    $('idWrapper').classList.toggle('field-error', err);
    const full = PREFIX + el.value;
    $('mId').value = full;
    const s = full.length >= 23 ? full.slice(17, 23) : (full.length > 17 ? full.slice(17) : '');
    $('mSuffixe').value = s;
    $('mSuffixeDisplay').textContent = s || '—';
}

function resetModal() {
    $('mIdSuffix').value = '';
    $('mId').value = '';
    $('idCounter').textContent = `(0/${VAR_LEN} chiffres)`;
    $('mSuffixe').value = '';
    $('mSuffixeDisplay').textContent = '—';
    $('idError').style.display = 'none';
    $('idWrapper').style.borderColor = 'var(--border)';
    $('idWrapper').classList.remove('field-error');
    const qteInp = $('mQte');
    qteInp.value = ''; qteInp.disabled = false;
    qteInp.classList.remove('field-error');
    $('qteError').style.display = 'none';
    $('mEmp').value = '';
    $('mEmp').classList.remove('field-error');
    document.querySelectorAll('input[name="mFonctionnel"]').forEach(r => r.checked = false);
    $('toggleGroup').classList.remove('field-error');
    $('foncError').style.display = 'none';
    setDropdownDisabled('Contenu', false); setDropdownValue('Contenu', '');
    setDropdownDisabled('Zones', false); setDropdownValue('Zones', '');
    setDropdownValue('Format', '');
    delete $('mContenu').dataset.prev;
    delete $('mZones').dataset.prev;
    delete qteInp.dataset.prev;
    closeAllDropdowns(null);
}

function ouvrirModal(index = -1) {
    $('editIndex').value = index;
    $('btnSupp').style.display = index === -1 ? 'none' : 'inline-flex';
    $('modalTitle').innerHTML = index === -1
        ? '<i class="ti ti-ticket"></i> Nouveau ticket'
        : '<i class="ti ti-edit"></i> Modifier le ticket';
    resetModal();
    if (index !== -1) {
        const t = tickets[index];
        const varPart = t.id.startsWith(PREFIX) ? t.id.slice(PREFIX.length) : t.id;
        $('mIdSuffix').value = varPart;
        $('mId').value = t.id;
        $('idCounter').textContent = `(${varPart.length}/${VAR_LEN} chiffres)`;
        $('mSuffixe').value = t.suffixe;
        $('mSuffixeDisplay').textContent = t.suffixe || '—';
        setDropdownValue('Format', t.format || '');
        $('mEmp').value = t.emprunteur === '—' ? '' : (t.emprunteur || '');
        const isNon = t.fonctionnel === 'non';
        if (t.fonctionnel) {
            const r = document.querySelector(`input[name="mFonctionnel"][value="${t.fonctionnel}"]`);
            if (r) r.checked = true;
        }
        if (isNon) {
            setNonFoncMode(true);
        } else {
            setDropdownValue('Contenu', t.contenu || '');
            setDropdownValue('Zones', t.zones || '');
            $('mQte').value = t.quantite || '';
            onContenuChange(t.contenu || '');
        }
    }
    $('myModal').classList.add('open');
}

function fermerModal() {
    $('myModal').classList.remove('open');
    closeAllDropdowns(null);
}

function confirmerSuppression(event) {
    // Si Shift n'est pas maintenu, afficher une confirmation
    if (!event.shiftKey) {
        if (!confirm('Êtes-vous sûr de vouloir supprimer ce ticket ?\n\nMaintenez Shift + clic pour supprimer sans confirmation.')) {
            return;
        }
    }
    supprimer();
}

function sauvegarder() {
    let hasError = false;
    let firstErrorEl = null;

    // 1. Validation ID
    const varPart = $('mIdSuffix').value;
    const idWrapper = $('idWrapper');
    const idError = $('idError');

    if (varPart.length !== VAR_LEN) {
        idError.textContent = '12 chiffres requis';
        idError.style.display = 'block';
        idWrapper.style.borderColor = 'var(--red)';
        idWrapper.classList.add('field-error');
        hasError = true;
        if (!firstErrorEl) firstErrorEl = idWrapper;
    } else {
        idError.style.display = 'none';
        idWrapper.style.borderColor = 'var(--border)';
        idWrapper.classList.remove('field-error');
    }

    const editIndex = parseInt($('editIndex').value);
    const fullId = $('mId').value;
    const doublon = tickets.findIndex((t, i) => t.id === fullId && i !== editIndex);
    if (doublon !== -1) {
        idError.textContent = `Ce numéro existe déjà`;
        idError.style.display = 'block';
        idWrapper.style.borderColor = 'var(--red)';
        idWrapper.classList.add('field-error');
        hasError = true;
        if (!firstErrorEl) firstErrorEl = idWrapper;
    }

    // 2. Validation Format
    const format = $('mFormat').value;
    const btnFormat = $('btnFormat');
    if (!format) {
        btnFormat.classList.add('field-error');
        hasError = true;
        if (!firstErrorEl) firstErrorEl = btnFormat;
    } else {
        btnFormat.classList.remove('field-error');
    }

    // 3. Validation Contenu
    const contenu = $('mContenu').value;
    const btnContenu = $('btnContenu');
    const isContenuDisabled = btnContenu.classList.contains('disabled-field');
    if (!isContenuDisabled && !contenu) {
        btnContenu.classList.add('field-error');
        hasError = true;
        if (!firstErrorEl) firstErrorEl = btnContenu;
    } else {
        btnContenu.classList.remove('field-error');
    }

    // 4. Validation Zones
    const zones = $('mZones').value;
    const btnZones = $('btnZones');
    const isZonesDisabled = btnZones.classList.contains('disabled-field');
    if (!isZonesDisabled && !zones) {
        btnZones.classList.add('field-error');
        hasError = true;
        if (!firstErrorEl) firstErrorEl = btnZones;
    } else {
        btnZones.classList.remove('field-error');
    }

    // 5. Validation Quantité
    const qteInp = $('mQte');
    const qteError = $('qteError');
    const isQteDisabled = qteInp.disabled;
    if (!isQteDisabled) {
        const qte = qteInp.value.trim();
        const qteOk = qte && !isNaN(qte) && parseInt(qte) >= 1;
        qteError.style.display = qteOk ? 'none' : 'block';
        qteInp.classList.toggle('field-error', !qteOk);
        if (!qteOk) {
            hasError = true;
            if (!firstErrorEl) firstErrorEl = qteInp;
        }
    } else {
        qteError.style.display = 'none';
        qteInp.classList.remove('field-error');
    }

    // Emprunteur : non obligatoire, pas de validation

    // 6. Validation Fonctionnel
    const fonctionnel = document.querySelector('input[name="mFonctionnel"]:checked')?.value || '';
    const toggleGroup = $('toggleGroup');
    const foncError = $('foncError');
    if (!fonctionnel) {
        toggleGroup.classList.add('field-error');
        foncError.style.display = 'block';
        hasError = true;
        if (!firstErrorEl) firstErrorEl = toggleGroup;
    } else {
        toggleGroup.classList.remove('field-error');
        foncError.style.display = 'none';
    }

    if (hasError) {
        if (firstErrorEl) {
            firstErrorEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        return;
    }

    const isNon = fonctionnel === 'non';
    const empRaw = $('mEmp').value.trim();
    const ticket = {
        id: fullId,
        suffixe: $('mSuffixe').value,
        format: format,
        contenu: isNon ? '—' : contenu,
        zones: isNon ? '—' : zones,
        quantite: isNon ? '—' : qteInp.value,
        emprunteur: empRaw || '—',
        fonctionnel
    };
    if (editIndex === -1) tickets.push(ticket);
    else tickets[editIndex] = ticket;
    sauvegarderAPI();
    fermerModal();
    render();
}

function supprimer() {
    tickets.splice(parseInt($('editIndex').value), 1);
    sauvegarderAPI();
    fermerModal();
    render();
}

function sortBy(column) {
    sortDirection = sortColumn === column ? (sortDirection === 'asc' ? 'desc' : 'asc') : 'asc';
    sortColumn = column;
    render();
}

function getTicketsTries() {
    const q = $('searchInput').value.toLowerCase();
    let indexed = tickets.map((t, i) => ({t, i}));
    if (q) {
        indexed = indexed.filter(({t}) =>
            [t.suffixe, t.contenu, t.id, t.emprunteur].some(v => (v || '').toLowerCase().includes(q))
        );
    }
    indexed.sort((a, b) => {
        let va = a.t[sortColumn], vb = b.t[sortColumn];
        if (sortColumn === 'quantite') {
            const na = (va === '—' || !va || isNaN(va)) ? -Infinity : parseFloat(va);
            const nb = (vb === '—' || !vb || isNaN(vb)) ? -Infinity : parseFloat(vb);
            return sortDirection === 'asc' ? na - nb : nb - na;
        }
        const cmp = (va ?? '').toString().localeCompare((vb ?? '').toString(), 'fr', {numeric:true, sensitivity:'base'});
        return sortDirection === 'asc' ? cmp : -cmp;
    });
    return indexed;
}

function majIconesTri() {
    document.querySelectorAll('.sort-icon').forEach(icon => {
        const col = icon.dataset.col;
        icon.className = 'sort-icon ti ' + (col === sortColumn
            ? (sortDirection === 'asc' ? 'ti-sort-ascending' : 'ti-sort-descending') + ' active'
            : 'ti-arrows-sort');
    });
}

function initials(name) {
    if (!name || name === '—') return '—';
    return name.trim().split(/\s+/).map(w => w[0].toUpperCase()).slice(0, 2).join('');
}

function fonctionnelBadge(val) {
    if (val === 'oui') return `<span class="badge-etat ok"><i class="ti ti-check"></i><span class="text-collapse"> Fonctionnel</span></span>`;
    if (val === 'non') return `<span class="badge-etat ko"><i class="ti ti-x"></i><span class="text-collapse"> Non fonctionnel</span></span>`;
    return `<span style="color:var(--text-muted)">—</span>`;
}

function render() {
    const tbody = $('ticketBody');
    const empty = $('emptyState');
    const totalQte = tickets.reduce((s, t) => s + (parseInt(t.quantite) || 0), 0);
    const nbOk = tickets.filter(t => t.fonctionnel === 'oui').length;
    const nbKo = tickets.filter(t => t.fonctionnel === 'non').length;
    const economies = (nbOk * 0.20).toLocaleString('fr-FR', {style:'currency', currency:'EUR'});

    $('statsBar').innerHTML = `
        <div class="stat-card"><div class="label">Tickets</div><div class="value">${tickets.length}</div></div>
        <div class="stat-card"><div class="label">Total voyages</div><div class="value">${totalQte}</div></div>
        <div class="stat-card"><div class="label">Fonctionnels</div><div class="value" style="color:#a5d6a7">${nbOk}</div></div>
        <div class="stat-card"><div class="label">Non fonctionnels</div><div class="value" style="color:#ef9a9a">${nbKo}</div></div>
        <div class="stat-card"><div class="label">Économies</div><div class="value" style="color:#a5d6a7">${economies}</div></div>
    `;

    majIconesTri();
    const rows = getTicketsTries();
    if (!rows.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    tbody.innerHTML = rows.map(({t, i}) => `
        <tr onclick="toggleSelectRow(this)" data-index="${i}">
            <td class="id-style">${t.id || '—'}</td>
            <td class="suffixe-style">${t.suffixe || '—'}</td>
            <td><span class="badge-format">${t.format || '—'}</span></td>
            <td class="contenu-style">${t.contenu || '—'}</td>
            <td>
                <div class="zones-cell">
                    ${zonesDots(t.zones)}
                    <span style="color:var(--text-muted)">${t.zones || '—'}</span>
                </div>
            </td>
            <td style="font-weight:600;text-align:center">${t.quantite || '—'}</td>
            <td>
                <div class="emprunteur-cell">
                    ${t.emprunteur && t.emprunteur !== '—'
                        ? `<div class="emp-avatar">${initials(t.emprunteur)}</div><span>${t.emprunteur}</span>`
                        : `<span style="color:var(--text-muted)">—</span>`}
                </div>
            </td>
            <td>${fonctionnelBadge(t.fonctionnel)}</td>
            <td><button class="btn-edit" onclick="ouvrirModal(${i})"><i class="ti ti-edit"></i><span class="text-collapse"> Éditer</span></button></td>
        </tr>
    `).join('');
}

function toggleSelectRow(tr) {
    if (event.target.closest('.btn-edit')) return;
    const wasSelected = tr.classList.contains('selected');
    document.querySelectorAll('#ticketBody tr.selected').forEach(r => r.classList.remove('selected'));
    if (!wasSelected) tr.classList.add('selected');
}

$('myModal').addEventListener('click', function(e) { if (e.target === this) fermerModal(); });

buildDropdowns();
charger();
</script>
</body>
</html>
